# Development on a workstation with the real models (paths relative to the repo root's parent).
[server]
host = "127.0.0.1"
port = 8700
data_dir = "../devdata"
public_url = "http://127.0.0.1:8700"

[asr]
backend = "faster_whisper"
model = "../models/faster-whisper-large-v3-turbo"
compute_type = "int8"
cpu_threads = 4
workers = 2
languages = ["en", "so", "ar", "sw"]

[llm]
backend = "openai_compat"
base_url = "http://127.0.0.1:8081/v1"
model = "qwen3-4b-instruct"
max_concurrency = 2
timeout_s = 30

[translate]
backend = "llm"
